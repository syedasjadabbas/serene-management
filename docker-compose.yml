services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serene
      POSTGRES_PASSWORD: serene
      POSTGRES_DB: serene_management
    ports:
      # Host port 5433: 5432 is commonly taken by a locally installed PostgreSQL service.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serene -d serene_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
