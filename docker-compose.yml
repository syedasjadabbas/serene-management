services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serene
      POSTGRES_PASSWORD: serene
      POSTGRES_DB: serene_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serene -d serene_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
